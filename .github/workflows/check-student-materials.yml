name: Verify student notebooks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check current student content
        run: python scripts/check_release.py
      - name: Simulate four weekly releases and verify blank notebooks
        run: python -m unittest discover -s tests -v
